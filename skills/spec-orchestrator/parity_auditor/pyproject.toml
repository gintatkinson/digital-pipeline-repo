[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parity_auditor"
version = "0.1.0"
description = "A modular package to verify model coverage and UML compliance"
# 3.9 is end-of-life (October 2025) and is retained deliberately, not by neglect.
# The development machine exposes only a bare `python3` at 3.9.6 — a probe for
# python3.10 through python3.13 finds no versioned binaries — so raising this floor
# breaks every local invocation and the `pip install -e` step. Assessed in issue
# #294, which is blocked on installing a newer interpreter, an environment change
# no code change can deliver. Two guards make retaining an EOL floor safe: CI also
# runs 3.12, and tests/test_python_312_migration_issue294.py statically rejects
# APIs that 3.12+ removes, which the 3.9 suites cannot see. Do not raise this line
# without doing both halves of #294.
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pytest>=8.3.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
parity-auditor = "parity_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Real-bug rules only. F is pyflakes (undefined names, redefinitions, unused imports),
# E9 is syntax and IO errors.
#
# Style families (E1-E7, W, I, N) are DELIBERATELY excluded. Enabling them across ~70
# previously unlinted files would generate a large cosmetic backlog that is a project in
# its own right and would stall defect work. See issue #293.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Imports in a package __init__ are the module's public API, not dead code. Ruff would
# otherwise offer to delete the re-exports that define the package surface.
"__init__.py" = ["F401"]
# The three F841 findings baselined here for cli.py and sync_validator.py were resolved
# in issue #303 - the cli.py probe loop was vestigial and was deleted, and
# sync_validator.py's spec_type was a lost consumer and is now stored in the
# tracker_specs / local_specs keys. F841 is enforced on both files again.
