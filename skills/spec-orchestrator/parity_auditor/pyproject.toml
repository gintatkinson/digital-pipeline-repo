[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parity_auditor"
version = "0.1.0"
description = "A modular package to verify model coverage and UML compliance"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pytest>=8.3.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
parity-auditor = "parity_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Real-bug rules only. F is pyflakes (undefined names, redefinitions, unused imports),
# E9 is syntax and IO errors.
#
# Style families (E1-E7, W, I, N) are DELIBERATELY excluded. Enabling them across ~70
# previously unlinted files would generate a large cosmetic backlog that is a project in
# its own right and would stall defect work. See issue #293.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Imports in a package __init__ are the module's public API, not dead code. Ruff would
# otherwise offer to delete the re-exports that define the package surface.
"__init__.py" = ["F401"]
# Three F841 unused-variable findings in these files are refactor remnants, not style:
#   cli.py has_parseable_schemas / has_alternative_schemas - superseded by the
#     all_definitions check at cli.py:562 and never removed
#   sync_validator.py spec_type - computed alongside is_spec but never stored
# Baselined rather than deleted so the finding is not silently erased.
# Tracked in issue #303; remove these ignores when it is resolved.
"src/parity_auditor/cli.py" = ["F841"]
"src/parity_auditor/validators/sync_validator.py" = ["F841"]
